# Checks for anything that is not a push to main.
#
# A push to main goes through .github/workflows/release.yml instead, which runs
# these same three checks against the version-stamped tree before it publishes
# anything — so running them here as well would only duplicate the work.
name: CI (typecheck + tests)

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Run unit tests
        run: npm test

      # Catches a broken frontend build before the (much slower) release
      # workflow gets that far.
      - name: Build frontend
        run: npm run build

  rust:
    # On Windows, not Linux: the core crate links against Tauri, which on
    # Linux would need a pile of webkit2gtk/gtk system packages installed
    # first. Windows is also what actually ships, so this tests the real
    # target — including the file locking and rename semantics the store
    # depends on.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Test the Rust side
        run: cargo test --manifest-path src-tauri/Cargo.toml -p seder-plus-shared -p seder-plus-core -p seder-plus-agent
