name: Build & Release Windows Installers

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "electron/**"
      - "scripts/package-win.mjs"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "vite.electron.config.ts"
      - "build/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

permissions:
  contents: write # required to publish a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Compute release version
        id: ver
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          echo "version=$BASE.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build + publish Windows installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: npm run package:win

      - name: Upload build (also available as a workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KollelTracker-windows-${{ steps.ver.outputs.version }}
          path: release-win
          if-no-files-found: error
