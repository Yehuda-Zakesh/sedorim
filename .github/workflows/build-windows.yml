name: Build Windows EXEs

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "scripts/build-exes.mjs"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Rust builds are the slow part of this workflow; without a cache every
      # run recompiles Tauri and its dependency tree from scratch.
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `npm install`, not `npm ci`: package-lock.json still carries the old
      # Electron/TanStack-Start dependency set and needs reconciling. Run
      # `npm install` locally once and commit the refreshed lock file, then
      # this can go back to `npm ci`.
      - name: Install dependencies
        run: npm install

      - name: Build both EXEs
        run: npm run exe

      # The whole build is now two ~10MB files instead of two ~250MB app
      # folders, so it fits the free artifact quota many times over — no more
      # deleting previous artifacts just to make room for the next upload.
      - name: Upload EXEs
        uses: actions/upload-artifact@v4
        with:
          name: SederPlus-windows
          path: release-win
          if-no-files-found: error
          retention-days: 30
