[package]
name = "seder-plus-quick"
version = "1.0.3"
description = "Seder Plus Quick — fast arrival/departure entry"
edition = "2021"
rust-version = "1.77.2"
publish = false

# The bin name is the EXE name: target/release/SederPlusQuick.exe
[[bin]]
name = "SederPlusQuick"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# See the note in ../full/Cargo.toml — without `custom-protocol` the built
# EXE loads build.devUrl (http://localhost:5173) instead of the frontend
# embedded in the binary, and fails with ERR_CONNECTION_REFUSED.
tauri = { version = "2", features = ["custom-protocol"] }
seder-plus-core = { path = "../core" }
