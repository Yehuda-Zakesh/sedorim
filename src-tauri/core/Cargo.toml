[package]
name = "seder-plus-core"
version = "1.0.3"
description = "Shared implementation behind SederPlus.exe and SederPlusQuick.exe"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "seder_plus_core"
path = "src/lib.rs"

[dependencies]
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
