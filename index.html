<!doctype html>
<html lang="he">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Deliberately no <title> here: document.title takes the *first* title
         element, so a static one would win over the per-route titles that
         <HeadContent> appends (see src/routes/__root.tsx). The window title
         comes from src-tauri until React mounts a moment later. -->
    <meta name="description" content="מערכת לניהול שמירת סדרים ישיבת כתר תורה" />
    <link rel="icon" href="/favicon.ico" />
    <!-- Heebo is shipped inside the EXE (public/fonts, @font-face in
         styles.css) rather than fetched from fonts.googleapis.com. The app is
         a desktop program that has to look the same offline, and the PDF
         exporter embeds the very same TTF files into the documents it
         produces — one copy of the font, one appearance everywhere. -->
    <link rel="preload" href="/fonts/Heebo-Regular.ttf" as="font" type="font/ttf" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
